services:
  - type: web
    name: teambooking-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./teamBooking.db
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://team-booking-sk.web.app
      - key: BACKEND_URL
        value: https://teambooking-api.onrender.com
      - key: PYTHONIOENCODING
        value: utf-8
